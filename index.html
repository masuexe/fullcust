<!DOCTYPE html>
<html>
    <head>
        <title>fullcust</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("fullcust_theme");
                    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                    var theme = (saved === "dark" || saved === "light") ? saved : (prefersDark ? "dark" : "light");
                    document.documentElement.setAttribute("data-bs-theme", theme);

                    var savedWidth = localStorage.getItem("fullcust_sidebar_width");
                    if (savedWidth) {
                        var parsedWidth = parseFloat(savedWidth);
                        if (!isNaN(parsedWidth) && parsedWidth >= 15 && parsedWidth <= 85) {
                            document.documentElement.style.setProperty("--sidebar-width", parsedWidth + "%");
                        }
                    }
                } catch (e) {}
            })();
        </script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css"
        />
        <style>
            :root {
                --sidebar-width: 40%;
            }

            @media (min-width: 992px) {
                .sidebar-panel {
                    position: fixed !important;
                    top: 0;
                    left: 0;
                    width: var(--sidebar-width, 40%) !important;
                    height: 100vh !important;
                    overflow-y: auto !important;
                    overflow-x: hidden !important;
                    border-right: 1px solid var(--bs-border-color) !important;
                    box-sizing: border-box !important;
                }
                .split-resizer {
                    position: fixed !important;
                    top: 0;
                    bottom: 0;
                    left: var(--sidebar-width, 40%) !important;
                    width: 10px !important;
                    margin-left: -5px !important;
                    cursor: col-resize !important;
                    z-index: 1030 !important;
                    display: flex !important;
                    align-items: center !important;
                    justify-content: center !important;
                    background-color: transparent;
                    transition: background-color 0.15s ease;
                    touch-action: none;
                }
                .split-resizer::after {
                    content: "";
                    position: absolute;
                    top: 0;
                    bottom: 0;
                    left: 4px;
                    width: 2px;
                    background-color: transparent;
                    transition: background-color 0.15s ease;
                }
                .split-resizer:hover::after,
                .split-resizer.is-dragging::after {
                    background-color: var(--bs-primary);
                }
                .split-resizer:hover,
                .split-resizer.is-dragging {
                    background-color: rgba(var(--bs-primary-rgb), 0.12);
                }
                .split-resizer-handle {
                    width: 4px;
                    height: 36px;
                    border-radius: 2px;
                    background-color: var(--bs-secondary-color);
                    opacity: 0.4;
                    pointer-events: none;
                    transition: opacity 0.15s ease, background-color 0.15s ease, height 0.15s ease;
                }
                .split-resizer:hover .split-resizer-handle,
                .split-resizer.is-dragging .split-resizer-handle {
                    opacity: 1;
                    height: 48px;
                    background-color: var(--bs-primary);
                }
                .main-panel {
                    margin-left: var(--sidebar-width, 40%) !important;
                    width: calc(100% - var(--sidebar-width, 40%)) !important;
                }
            }

            @media (max-width: 991.98px) {
                .sidebar-panel {
                    position: static !important;
                    width: 100% !important;
                    height: auto !important;
                    border-right: none !important;
                    overflow-x: hidden !important;
                }
                .split-resizer {
                    display: none !important;
                }
                .main-panel {
                    margin-left: 0 !important;
                    width: 100% !important;
                }
            }
        </style>
    </head>
    <body>
        <main id="main"></main>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
            crossorigin="anonymous"
        ></script>
        <script type="module" src="index.tsx"></script>
    </body>
</html>
